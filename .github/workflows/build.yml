name: Build

# Fetch, build and package the kernel on pull requests and branch pushes, so
# breakage shows up before a release.  No artefacts are kept: release.yml does
# that on a tag.
#
# arm64 only, and native: that is what the board is, GitHub's arm64 runners are
# free for public repositories, and CROSS_COMPILE= (empty) skips the cross
# toolchain entirely.  The tree is cloned from GitHub by fetch.sh, so no secret
# or setup is needed.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 240
    env:
      # Native arm64: no aarch64-linux-gnu- toolchain on the runner, and the
      # kernel it produces is the one the board runs.
      CROSS_COMPILE: ''
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Free disk space
        # A kernel build wants tens of GB and the runner ships with far less
        # free.  Remove toolchains this build never uses.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - name: Install the build dependencies
        # fetch.sh clones, build.sh wants the usual kbuild tools (zstd because
        # CONFIG_MODULE_COMPRESS_ZSTD compresses the modules), package.sh wants
        # dpkg-deb (already present).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              bc bison flex libelf-dev libssl-dev zstd

      - name: Fetch the mainline tree
        run: ./fetch.sh

      - name: Build the kernel
        run: ./build.sh

      - name: Build the packages
        run: ./package.sh

      - name: Inspect the packages
        # dpkg-deb -I says what the package is and what it depends on; -c says
        # what it carries.  Printing both is the cheapest guard against a
        # package that builds but is empty or mislabelled.
        run: |
          set -eu
          for deb in build/debs/*.deb; do
            echo "== $deb =="
            dpkg-deb -I "$deb"
            dpkg-deb -c "$deb"
          done
